  <body>
    <div id="root"></div>
    <script>
      // Register Service Worker — silent updates, no forced reloads to avoid React removeChild errors
      if ('serviceWorker' in navigator) {
        // Defer reload to avoid interrupting React's unmount lifecycle
        let reloadScheduled = false;
        const scheduleReload = () => {
          if (reloadScheduled) return;
          reloadScheduled = true;
          setTimeout(function() { window.location.reload(); }, 500);
        };

        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                scheduleReload();
              }
            });
          });

          if (reg.waiting && navigator.serviceWorker.controller) {
            scheduleReload();
          }
        }).catch(function() {
          // SW registration failed silently — app still works without it
        });

        navigator.serviceWorker.addEventListener('controllerchange', function() {
          scheduleReload();
        });
      }
    </script>
